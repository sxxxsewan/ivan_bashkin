services:
  ivan_bashkin_postgres:
    image: postgres:16
    container_name: ivan_bashkin_postgres
    environment:
      POSTGRES_DB: ivan_bashkin
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - ivan_bashkin_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ivan_bashkin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ivan_bashkin_pgdata: